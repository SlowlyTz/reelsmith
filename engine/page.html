<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>reelsmith</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="page.css">
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<button id="play" class="hidden"><span class="big" id="ptitle"></span><span>▶ Abspielen</span></button>
<audio id="audio" preload="auto"></audio>
<!--ENGINE-->
<script src="core.js"></script>
<script src="timeline.js"></script>
<script src="captions.js"></script>
<script src="runtime.js"></script>
<script src="../audio/dsl.js"></script>
<script src="../audio/mixer.js"></script>
<!--/ENGINE-->
<!--STYLES--><script>
// visual styles (JSON): loaded on demand for story.style; tools/html.mjs inlines the one a video uses
window.VG_STYLES = {
  "paper": ["styles/paper/paper.js", "styles/paper/puppet.js", "styles/paper/props.js", "styles/paper/frames/book.js",
    "styles/paper/frames/stage.js", "styles/paper/post.js", "styles/paper/subtitles.js"],
  "clean": ["styles/clean/clean.js", "styles/clean/draw.js", "styles/clean/ui.js", "styles/clean/frames/board.js",
    "styles/clean/frames/desktop.js", "styles/clean/post.js", "styles/clean/subtitles.js"]
};
</script><!--/STYLES-->
<!--STORY-->
<script>
// Modes: ?story=<slug> [&format=9:16] [&mode=play|render|mix|still] [&t=12.5]
(async function () {
  const VG = window.VG, q = new URLSearchParams(location.search), mode = q.get('mode') || (q.has('t') ? 'still' : 'play');
  const loadScript = (src) => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('cannot load ' + src)); document.head.appendChild(s); });
  try {
    let story = window.STORY, voice = window.VOICE;
    const slug = q.get('story') || story?.slug;
    if (!story) {
      story = await (await fetch(`../stories/${slug}/story.json`)).json();
      voice = await fetch(`../build/_${slug}/voice/voice.json`).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
    }
    story.slug = story.slug || slug;
    if (q.get('format')) story.format = q.get('format');
    const style = story.style || 'paper';
    if (!VG.styles?.[style]) {   // the style first: scenes.js may read its helpers (VG.S, VG.G …) when it loads
      if (!window.VG_STYLES[style]) throw new Error(`unknown style "${style}" (available: ${Object.keys(window.VG_STYLES).join(', ')})`);
      for (const src of window.VG_STYLES[style]) await loadScript(src);
    }
    if (!window.STORY) {
      await loadScript(`../stories/${slug}/scenes.js`);
      await loadScript(`../stories/${slug}/score.js`).catch(() => {});
    }
    const fams = VG.styles[style].fonts || [];
    await Promise.all(fams.map((f) => document.fonts.load(f, 'AaÄäÖöÜüß…').catch(() => console.warn('font missing: ' + f))));
    const T = VG.start(story, voice || {});
    const cv = document.getElementById('c'), ctx = cv.getContext('2d');
    cv.width = VG.W; cv.height = VG.H;
    for (let t = 0; t < T.end; t += 2.3) VG.render(ctx, t);   // warm-up: builds every cached shape
    VG.ready = true;
    if (mode === 'render' || mode === 'mix') return;
    if (mode === 'still') return VG.render(ctx, parseFloat(q.get('t') || '0'));
    const audio = document.getElementById('audio'), btn = document.getElementById('play');
    audio.src = window.AUDIO_SRC || `../build/_${story.slug}/audio/soundtrack.m4a`;
    document.getElementById('ptitle').textContent = story.title;
    btn.classList.remove('hidden'); VG.render(ctx, 0);
    btn.onclick = () => {
      btn.classList.add('hidden'); audio.currentTime = 0; audio.play().catch(() => {});
      const t0 = performance.now();
      const loop = () => { const t = audio.paused || !isFinite(audio.duration) ? (performance.now() - t0) / 1000 : audio.currentTime;
        VG.render(ctx, Math.min(t, T.end)); if (t < T.end) requestAnimationFrame(loop); else btn.classList.remove('hidden'); };
      loop();
    };
  } catch (e) { window.VG_ERROR = String(e.stack || e); console.error(e); }
})();
</script>
<!--/STORY-->
</body>
</html>
